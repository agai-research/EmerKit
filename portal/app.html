function findCombo() {
  const eng = ENG.emerkit, deny = eng.deny('standard'), lab = eng.labels(levelFor()), truth = eng.labels(levelFor(), 'truth');
  for (const ty of ['formative', 'summative', 'practice', 'acquisition', 'discussion', 'production']) {
    const R_ = V.type_caps[ty].filter(c => !V.caps[c].domains || V.caps[c].domains.includes('programming'));
    const task = {type: ty, domain: 'programming', concepts: ['loops'], R: R_, D: [...V.default_d[ty]], delta_in: []};
    const cands = eng.candidates(task); const {F, P} = eng.forbidden(cands, lab, task, deny);
    for (const [k, cs] of P) {const [i, j] = k.split('|').map(Number); if (F.has(i) || F.has(j) || !eng.T[i].truth || !eng.T[j].truth) continue;
      const tr = eng.forbidden([i, j], truth, task, deny); if (!tr.P.size) continue;   /* the combination is also forbidden under the true behaviour */
      return {ty, i, j, c: cs[0], task}}
  }
  return null;
}

   <input class="in" id="s-mcustom" placeholder="model identifier, for example claude-sonnet-5-5" style="margin-top:6px" ${custom ? '' : 'hidden'} value="${custom ? esc(S.model) : ''}"></div>
  <div id="p-oai" ${S.provider === 'openai' ? '' : 'hidden'}>
   <label class="f" for="s-obase">Server address ${tip('Base URL of an OpenAI-compatible API. Ollama serves one at http://localhost:11434/v1 once it is installed and running.')}</label><input class="in" id="s-obase" value="${esc(S.obase)}">
   <label class="f" for="s-omodel">Model name</label><input class="in" id="s-omodel" value="${esc(S.omodel)}" placeholder="qwen3:8b">
   <p class="small muted" style="margin:6px 0 0">To download and run a model locally: install Ollama (ollama.com), then run <span class="mono">ollama pull ${esc(S.omodel || 'qwen3:8b')}</span> in a terminal. The portal calls it through serve.py.</p></div>
  <label class="small" style="display:flex;gap:6px;margin-top:12px"><input type="checkbox" id="s-fb" ${S.fallback ? 'checked' : ''}> if the model fails, switch to the rule-based method without asking</label>
  <div class="row" style="margin-top:14px"><button class="btn" id="test">Test the connection</button><span id="tres" class="small"></span></div></div>
  <div class="panel"><h2>Composition</h2>
  <label class="f" for="s-reg">Registry</label><select class="in" id="s-reg">${opt('emerkit', S.registry, 'EmerKit registry (163 tools, ground truth)')}${opt('real', S.registry, 'EmerKit registry + 6,044 real Toucan tools')}</select>
  <label class="f" for="s-prof">Norm profile ${tip('Which learner data may reach which receiver. Strict forbids more flows; permissive allows learner content to reach third parties in some tasks.')}</label><select class="in" id="s-prof">${['permissive', 'standard', 'strict'].map(p => opt(p, S.profile, p)).join('')}</select>
  <label class="f" for="s-lev">Level ε of the prediction sets ${tip('The level ε decides how much uncertainty about a tool is tolerated. Calibration certified ε = ' + eh + ' for a 5% target risk; the same level is certified for a 10% target, so both targets give the same toolkits. Each option shows the risk and coverage measured on test tasks.')}</label><select class="in" id="s-lev">${lev}</select>
  <label class="f" for="s-B">Context budget: <b id="bv">${S.B}</b> tokens ${tip('Maximum number of tokens that the tool definitions of one toolkit may occupy in the agent context.')}</label><input id="s-B" type="range" min="500" max="4000" step="250" value="${S.B}" style="width:100%">
  <label class="f" for="s-k">Maximal toolkit size</label><select class="in" id="s-k">${[2, 3, 4, 5, 6].map(k => opt(k, S.k_max, k + ' tools')).join('')}</select>
  <label class="f" for="s-mode">Task contexts ${tip('Isolated: one agent session per task. Conservative: tasks share a context, so data returned upstream is present downstream.')}</label><select class="in" id="s-mode">${opt('isolated', S.mode, 'isolated')}${opt('conservative', S.mode, 'conservative')}</select>
  <label class="f" for="s-sub">Substitutions per workflow</label><select class="in" id="s-sub">${[0, 1, 2, 3].map(k => opt(k, S.s_max, k)).join('')}</select>
  <p class="small muted" style="margin-top:12px">Changes apply to the next plan; the plan page offers to recompute the current plan.</p></div></div>`;
  const changed = () => {saveS(); if (RUN && !RUN.error) RUN.stale = true};
  const bind = (id, k, f = x => x) => $(id).onchange = e => {S[k] = f(e.target.value); changed()};
  bind('#s-gen', 'generator'); bind('#s-reg', 'registry'); bind('#s-prof', 'profile'); bind('#s-lev', 'level', Number); bind('#s-k', 'k_max', Number); bind('#s-mode', 'mode'); bind('#s-sub', 's_max', Number);
  $('#s-prov').onchange = e => {S.provider = e.target.value; saveS(); $('#p-anth').hidden = S.provider !== 'anthropic'; $('#p-oai').hidden = S.provider !== 'openai'};
  $('#s-model').onchange = e => {if (e.target.value === '__custom') {$('#s-mcustom').hidden = false; $('#s-mcustom').focus()} else {$('#s-mcustom').hidden = true; S.model = e.target.value; saveS()}};
  $('#s-mcustom').oninput = e => {if (e.target.value.trim()) {S.model = e.target.value.trim(); saveS()}};
  $('#s-obase').oninput = e => {S.obase = e.target.value.trim(); saveS()}; $('#s-omodel').oninput = e => {S.omodel = e.target.value.trim(); saveS()};
  $('#s-B').oninput = e => {$('#bv').textContent = e.target.value}; $('#s-B').onchange = e => {S.B = +e.target.value; changed()};
  $('#s-key').oninput = e => {const v = e.target.value.trim(); if (S.remember) store.set('key', v); else sess.set('key', v)};
  $('#s-rem').onchange = e => {S.remember = e.target.checked; const v = $('#s-key').value.trim(); if (S.remember) store.set('key', v); else {store.set('key', ''); sess.set('key', v)} $('#remwarn').hidden = !S.remember; saveS()};
  $('#clrkey').onclick = () => {store.set('key', ''); sess.set('key', ''); $('#s-key').value = ''; $('#tres').innerHTML = '<span class="badge">key removed from this browser</span>'};
  $('#s-fb').onchange = e => {S.fallback = e.target.checked; saveS()};
  relayReady.then(() => {const c = runContext(); $('#ctx').innerHTML = `<div class="${c.kind === 'relay' ? 'ok' : 'note'}">${esc(c.text)}</div>`});
  $('#test').onclick = async () => {$('#tres').textContent = 'Calling the model…'; const calls = [];
    try {const t = await callLLM('Answer in one short sentence.', 'Say hello to a learner.', 'connection test', calls, 200); const c = calls[0];
      $('#tres').innerHTML = `<span class="badge b-safe">✓ connected</span>`;
      dialogBox(true, 'Connection successful', `<p>${esc(c.model)} answered in ${(c.ms / 1000).toFixed(1)} s (${c.input ?? '?'} input and ${c.output ?? '?'} output tokens${c.id ? `, request <span class="mono">${esc(c.id)}</span>` : ''}, ${c.via}):</p><p class="small muted">“${esc(t.slice(0, 160))}”</p><p>Plans will be generated by this model.</p>`,
        [{label: 'Stay in Settings', ghost: true}, {label: 'Go to Plan my learning', action: () => {sess.set('rule', ''); location.hash = 'plan'}}])}
    catch (e) {$('#tres').innerHTML = `<span class="badge b-bad">failed</span>`;
      dialogBox(false, 'Connection failed', `<p>${esc(e.message)}</p><p><b>Do you want to continue with the rule-based mode?</b> Plans will then be generated without a language model, for this session.</p>`,
        [{label: 'No, stay in Settings', ghost: true}, {label: 'Yes, use the rule-based mode', action: () => {sess.set('rule', '1'); location.hash = 'plan'}}])}};
}

/* ---------------- about ---------------- */
function viewAbout() {
  const repo = PAPER.repo && !PAPER.repo.startsWith('__') ? PAPER.repo : null;
  $('#view').innerHTML = `<h1>About EmerKit</h1>
  <div class="grid g2" style="margin-top:14px;align-items:start"><div class="panel"><span class="badge b-acc">Research article</span><h2 style="margin-top:8px">${esc(PAPER.title)}</h2>
  <div class="grid" style="margin-top:14px;gap:10px">${PAPER.authors.map(([n, a]) => `<div class="author"><span class="avatar">${n.split(' ').map(w => w[0]).join('')}</span><span><b>${esc(n)}</b><br><span class="small muted">${esc(a)}</span></span></div>`).join('')}</div>
  <div class="row" style="margin-top:14px">${PAPER.keywords.map(k => `<span class="badge">${k}</span>`).join('')}</div></div>
  <div class="panel"><h2>The approach in brief</h2><p>LLM agents now reach learning services through tools exposed with the Model Context Protocol. Existing selectors rank tools one by one, as if the quality of a toolkit were the sum of the qualities of its tools. EmerKit shows that this fails when the consumer is an LLM agent: tools duplicate each other, interfere, saturate the context window, and jointly create flows of learner data that no single tool creates.</p>
  <p>EmerKit derives a learning workflow from a learner's request and equips each task with the admissible toolkit of highest quality, a non-additive set function that counts each capability once, integrates quality of service, and charges interference and saturation. Every toolkit is checked on a flow graph against norms specific to education, with conformal prediction sets for unreliable annotations and a calibrated bound on the risk of a denied flow. Tasks that cannot be equipped are replaced by substitutes that preserve their learning objective, and a gap map states what the MCP ecosystem can safely support.</p>
  <div class="row" style="margin-top:12px">${/^https?:$/.test(location.protocol) && runContext().kind !== 'preview' ? '<a class="btn ghost" href="EmerKit_portal_demo.mp4" target="_blank" rel="noopener">▶ Demo video (3 min)</a>' : ''}${repo ? `<a class="btn" href="${esc(repo)}" target="_blank" rel="noopener">GitHub repository</a>` : '<span class="badge" data-tip="The address of the public repository will appear here once it is published.">GitHub repository: to be published</span>'}<a class="btn ghost" href="#approach">How it works</a></div></div></div>
  <div class="grid g3" style="margin-top:16px"><div class="panel"><h3>What runs in this portal</h3><p class="small">The request phase of EmerKit runs live in your browser: decomposition, planning, validation and repair, flow check, exact composition, revision. It was checked against the implementation of the paper on 550 tasks: same feasibility, same optimum, same minimal conflicts.</p></div>
  <div class="panel"><h3>Run it on your computer</h3><p class="small">In the repository: <span class="mono">python portal/serve.py</span>, then open <span class="mono">http://localhost:8000</span>. The local relay lets the page reach the language model and the official MCP Registry.</p></div>
  <div class="panel"><h3>Cite</h3><p class="small mono" style="white-space:pre-wrap">${esc(`F. Ghedass, H. Mezni, A. Alsehaim, H. Elmannai, S. Alalmaei, M. Sliti. ${PAPER.title}.`)}</p></div></div>`;
}
route();
</script>
</body>
